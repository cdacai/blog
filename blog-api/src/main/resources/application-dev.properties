# 本地开发配置：在 prd 完整属性之后加载，只覆盖开发环境差异。

# 本地服务地址
blog.api=http://localhost:${server.port}/blog
blog.cms=http://localhost:8079
blog.view=http://localhost:8080

# 本地前台和后台开发服务器
blog.cors.origins=http://localhost:8079,http://localhost:8080,http://localhost:8081

# 本地 Redis 未设置 requirepass，不发送 AUTH。
spring.redis.password=

# localhost 不使用跨子域安全 Cookie。
token.admin-comment-cookie-domain=
token.admin-comment-cookie-secure=false

# 开发环境使用本地文件，不调用外部存储和内容审核。
upload.channel=local
upload.path=upload
upload.access-path=images
baidu.content.enabled=false

spring.devtools.restart.enabled=false
